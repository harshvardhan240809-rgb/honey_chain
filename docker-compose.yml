version: '3.8'

services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  server:
    build: ./server
    ports:
      - "4000:4000"
    depends_on:
      - mongo
    env_file:
      - .env

  client:
    build: ./client
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongo-data:
